<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS3 Product Card</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styliling.css">
</head>
<body>

  <div class="product-card">
    
    <div class="product-image">
        <img src="products/pinky.jpg" alt="Keyboard 6000" style="width: 100%; height: 100%; object-fit: cover;">
    </div>
    
    <div class="product-info">
      <h3 class="product-name">Keyboard 6000</h3>
      
      <p class="product-price">₱1000.00</p>
      
      <p class="product-description">
        For all your necessary gaming or office needs, choose Keyboard 6000.
      </p>
      
      <button class="buy-button">Buy Now</button>
    </div>

  </div>

</body>
</html>
